{% extends "studio/web/base.html" %}

{% block content %}
<section class="panel form-panel">
    <h1>Удаление заказа</h1>

    <p>
        Удалить заказ {{ order.order_number }}
        клиента {{ order.client.full_name }}?
    </p>
    <p class="muted">
        Запись, история её статусов и связанные уведомления будут удалены.
        Отменить это действие нельзя.
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button class="danger" type="submit">Удалить заказ</button>
            <a class="button secondary"
               href="{% url 'studio_web:order_detail' order.pk %}">
                Не удалять
            </a>
        </div>
    </form>
</section>
{% endblock %}
